<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* box : 흰색배경 */
      .box {
        background-color: white;
      }

      /* 왼쪽 화살표 : 왼쪽 */
      /* .box img:first-child */
      img[src="../data/left-arrow.png"] {
        float: left;
      }

      /* 오른쪽 화살표 : 오른쪽 */
      /* .box img:nth-child(2) */
      img[src="../data/right-arrow.png"] {
        float: right;
      }

      /* p 영역은 원래대로 */
      p {
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="../data/left-arrow.png" alt="" />
      <img src="../data/right-arrow.png" alt="" />
      <p>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Et atque asperiores placeat debitis esse odit tempore
        vitae deserunt? Incidunt delectus laudantium quidem modi impedit blanditiis repellendus vitae culpa quisquam.
        Ducimus.
      </p>
    </div>
  </body>
</html>
