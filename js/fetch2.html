<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div></div>
    <script>
      async function load() {
        const response = await fetch("https://jsonplaceholder.typicode.com/users1");
        const data = await response.json();
        console.log(data); // json == js 객체 / python dict

        let result = `<ul>`;
        data.forEach((item) => {
          result += `<li>userId ; ${item.id}</li>`;
          result += `<li>name ; ${item.name}</li>`;
          result += `<li>username ; ${item.username}</li>`;
          result += `<li>email ; ${item.email}</li>`;
        });
        result += `</ul>`;
        document.querySelector("div").innerHTML = result;
      }
      load();
    </script>
  </body>
</html>
