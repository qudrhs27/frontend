<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .text-danger {
        color: red;
        display: none;
      }
    </style>
  </head>
  <body>
    <form action="" method="get">
      <div>
        <label for="userid">아이디</label>
        <input type="text" name="userid" id="userid" />
        <div class="text-danger">아이디를 입력해 주세요</div>
      </div>
      <div>
        <label for="password">비밀번호</label>
        <input type="password" name="password" id="password" />
        <div class="text-danger">비밀번호를 입력해 주세요</div>
      </div>
      <div>
        <label for="tel">전화번호</label>
        <input type="tel" name="tel" id="tel" />
        <div class="text-danger">전화번호를 입력해 주세요</div>
      </div>
      <button type="submit">전송</button>
    </form>
    <script>
      // submit 이벤트
      // 검증 alert()
      const form = document.querySelector("form");
      const errMsg = document.querySelector(".text-danger");
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const form = e.target;

        const regExp1 = /^\d{3}-\d{4}-\d{4}$/;

        if (form.userid.value === "") {
          alert("아이디 입력");
          form.userid.focus();
          return;
        } else if (form.password.value === "") {
          alert("비밀번호 입력");
          form.userid.focus();
          return;
        } else if (!regExp1.test(form.tel.value)) {
          // 전화번호 패턴 010-1234-5678
          alert("전화번호 확인해주세요");
          form.userid.focus();
          return;
        }

        form.submit();
      });
    </script>
  </body>
</html>
